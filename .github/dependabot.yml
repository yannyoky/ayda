version: 2
updates:
  # CI actions; one grouped PR per week instead of one PR per action
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Backend (uv.lock); minor and patch bumps grouped, majors stay separate PRs
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor:
        update-types: [minor, patch]

  # Mini App (npm); minor and patch bumps grouped, majors stay separate PRs
  - package-ecosystem: npm
    directory: /miniapp
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node major we run (22), not the latest one
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      miniapp-minor:
        update-types: [minor, patch]
