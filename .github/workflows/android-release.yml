name: Android release

# Builds a signed release APK and attaches it to a GitHub Release (mobile/README.md, "Release").
# Run by hand: Actions → Android release → Run workflow. The keystore exists only in the secrets of
# the protected `production` environment, whose reviewer approves each run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 0.1.0 (the tag becomes android-v<version>)'
        required: true

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ayda.jks"
      - name: Build
        env:
          AYDA_KEYSTORE_FILE: ${{ runner.temp }}/ayda.jks
          AYDA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AYDA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AYDA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AYDA_SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
          AYDA_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          AYDA_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          AYDA_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          AYDA_FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
        run: >
          ./gradlew assembleRelease
          -Payda.apiBaseUrl=https://${{ vars.AYDA_DOMAIN }}/api/v1
          -Payda.versionName=${{ inputs.version }}
          -Payda.versionCode=${{ github.run_number }}
      - name: Verify the signature and show the certificate fingerprint
        run: |
          apk=$(ls androidApp/build/outputs/apk/release/*.apk)
          cp "$apk" "ayda-${{ inputs.version }}.apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "ayda-${{ inputs.version }}.apk" | tee certs.txt
          sha=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          {
            echo "### Signing certificate"
            echo "Put this into \`ANDROID_CERT_SHA256\` on the VPS (invite App Links):"
            echo
            echo "\`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "android-v${{ inputs.version }}"
          "ayda-${{ inputs.version }}.apk"
          --title "Android ${{ inputs.version }}"
          --notes "Signed APK. Install it from this page; updates come as new releases."
          --prerelease
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ayda.jks"
