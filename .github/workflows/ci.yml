name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files via the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' && steps.exists.outputs.backend == 'true' }}
      miniapp: ${{ steps.filter.outputs.miniapp == 'true' && steps.exists.outputs.miniapp == 'true' }}
      mobile: ${{ steps.filter.outputs.mobile == 'true' && steps.exists.outputs.mobile == 'true' }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            miniapp:
              - 'miniapp/**'
              - 'contracts/openapi.yaml' # the Mini App's API client is generated from it
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'contracts/openapi.yaml' # the Kotlin API client is generated from it
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'
      # Skip a component until its project files exist
      - id: exists
        run: |
          echo "backend=$( test -f backend/pyproject.toml && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "miniapp=$( test -f miniapp/package.json && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "mobile=$( test -f mobile/settings.gradle.kts && echo true || echo false )" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ayda
          POSTGRES_PASSWORD: ayda
          POSTGRES_DB: ayda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayda -d ayda_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Same channel config as docker-compose.yml (ADR 0007); test-only secrets.
      centrifugo:
        image: centrifugo/centrifugo:v6
        env:
          CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: test-centrifugo-token-secret-0123456789
          CENTRIFUGO_HTTP_API_KEY: test-centrifugo-api-key
          CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"personal","allow_user_limited_channels":true,"history_size":100,"history_ttl":"1h","force_recovery":true}]'
        ports:
          - 8001:8000
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ayda:ayda@localhost:5432/ayda_test
      TEST_CENTRIFUGO_URL: http://localhost:8001
      TEST_CENTRIFUGO_API_KEY: test-centrifugo-api-key
      TEST_CENTRIFUGO_TOKEN_SECRET: test-centrifugo-token-secret-0123456789
      REQUIRE_CENTRIFUGO: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest

  miniapp:
    needs: changes
    if: needs.changes.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # The Android SDK is preinstalled on GitHub runners (ANDROID_HOME); AGP fetches missing platforms.
      - run: ./gradlew ktlintCheck lint :shared:testAndroidHostTest :androidApp:testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ayda-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npx -y @redocly/cli@2.56.1 lint openapi.yaml
