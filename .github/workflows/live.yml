name: Live checks

# Real calls to the external services the backend depends on (weather, listings, maps, LLM,
# Telegram), through the app's own clients: `pytest -m live` runs ayda.smoke. Weekly and by
# hand, never on pull requests, so a third-party outage does not block merges. A check whose
# key is missing from the repository secrets is skipped. GitHub runners are outside Russia;
# to see what the production server reaches, run `python -m ayda.smoke` there (docs/deploy.md).
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 09:00 MSK
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDERS: groq-gptoss20b,groq-gptoss120b,cloudflare-llama70b,cloudflare-gptoss120b
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # A separate test bot: the production bot's token signs initData for every user, so it
      # lives only on the server and in the protected `production` environment (audit V8).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run pytest -m live -v -rs
