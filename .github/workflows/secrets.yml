name: Secrets

# Scans the whole git history for leaked secrets with gitleaks.
# Known false positives live in .gitleaksignore or carry a `gitleaks:allow` comment.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not only the last commit
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # Built from source: the Go checksum database verifies the module
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: "$(go env GOPATH)/bin/gitleaks git . --redact --verbose --exit-code 1"
