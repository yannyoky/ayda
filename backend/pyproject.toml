[project]
name = "ayda-backend"
version = "0.1.0"
description = "Ayda backend: modular monolith (API, AI assistant, background jobs)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "boto3>=1.43.114",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "httpx>=0.28",
    "import-linter>=2.1",
    "jsonschema>=4.23",
    "moto>=5.2.4",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ayda"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# User-facing text is Russian; Cyrillic letters are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests", "migrations"]
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_package = "ayda"

[[tool.importlinter.contracts]]
name = "Domain modules do not import each other"
type = "independence"
modules = [
    "ayda.modules.auth",
    "ayda.modules.quests",
    "ayda.modules.assistant",
    "ayda.modules.events",
    "ayda.modules.social",
    "ayda.modules.chat",
    "ayda.modules.habits",
    "ayda.modules.analytics",
]
