[project]
name = "ayda-backend"
version = "0.1.0"
description = "Ayda backend: modular monolith (API, AI assistant, background jobs)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ayda"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "ayda"

[[tool.importlinter.contracts]]
name = "Domain modules do not import each other"
type = "independence"
modules = [
    "ayda.modules.auth",
    "ayda.modules.quests",
    "ayda.modules.assistant",
    "ayda.modules.events",
    "ayda.modules.social",
    "ayda.modules.chat",
    "ayda.modules.habits",
    "ayda.modules.analytics",
]
