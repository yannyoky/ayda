steps:
- Сварить пасту, оставив полстакана воды от варки.
- Обжарить бекон до румяности. Смешать яйца с тёртым сыром и перцем.
- Снять сковороду с огня, соединить пасту, бекон и яичную смесь, разбавляя водой до кремовой консистенции.
