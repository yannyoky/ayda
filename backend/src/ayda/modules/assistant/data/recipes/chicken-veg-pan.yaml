id: chicken-veg-pan
title: Куриное филе с овощами на сковороде
meal: dinner
minutes: 30
servings: 2
tags:
- one-pan
- light
ingredients:
- ingredient: chicken_fillet
  amount: 350
- ingredient: zucchini
  amount: 250
- ingredient: bell_pepper
  amount: 1
- ingredient: onion
  amount: 1
- ingredient: oil
  amount: 2
- ingredient: soy_sauce
  amount: 1
  optional: true
- ingredient: salt
  amount: 1
- ingredient: pepper
