id: pasta-tuna
title: Паста с тунцом и помидорами
meal: dinner
minutes: 20
servings: 2
tags:
- quick
- cheap
ingredients:
- ingredient: pasta
  amount: 200
- ingredient: tuna_canned
  amount: 150
