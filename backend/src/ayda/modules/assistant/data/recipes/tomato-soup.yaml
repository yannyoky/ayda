id: tomato-soup
title: Томатный суп
meal: lunch
minutes: 30
servings: 2
tags:
- cheap
- vegetarian-friendly
ingredients:
- ingredient: canned_tomatoes
  amount: 600
- ingredient: onion
  amount: 1
- ingredient: garlic
  amount: 2
- ingredient: olive_oil
  amount: 2
- ingredient: herbs_dried
  amount: 1
- ingredient: cream
  amount: 80
  optional: true
- ingredient: salt
  amount: 1
- ingredient: sugar
  amount: 1
steps:
- Обжарить лук и чеснок на масле.
- Добавить томаты, 200 мл воды, травы, соль и сахар, варить 15 минут.
- Пробить блендером, при желании добавить сливки.
