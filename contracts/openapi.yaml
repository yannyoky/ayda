openapi: 3.1.0
info:
  title: Ayda API
  version: 0.6.0
  summary: MVP contract, milestones M1-M3 (US-01..US-19), native sign-in (M4)
  description: |
    Contract-first API of the Ayda backend (ADR 0004). The Mini App and native clients
    generate their API code from this file; the backend must conform to it.

    Conventions:
    - All times are RFC 3339 in UTC; `local_date` is the calendar date in the user's time zone.
    - Errors use RFC 9457 problem details (`application/problem+json`).
    - Lists use opaque cursors: pass `next_cursor` back as `cursor`.
    - All user-facing text from the server is in Russian.
    - Local development serves the same paths at `http://localhost:8000/api/v1`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.ayda.example/api/v1
    description: Production (domain to be chosen)
security:
  - bearer: []
tags:
  - name: auth
    description: |
      Sign-in with Telegram Mini App initData, or by a one-time email code in the native
      apps (ADR 0009). Native sessions also get a rotating refresh token.
  - name: profile
    description: Profile settings, onboarding, consent, goals and own habits.
  - name: reference
    description: Cities and the goal catalog.
  - name: day
    description: Morning check-in, the daily quest pool, taking, replacing and completing quests.
  - name: media
    description: Photo uploads for proofs.
  - name: social
    description: Invites, friends, feed, likes, comments and the weekly ladder.
  - name: coop
    description: |
      Co-op quests at a distance (US-18): invite 1-3 friends to a taken quest; each does it
      on their own; if every participant completes it, each gets +50%.
  - name: chat
    description: |
      Direct messages between friends and co-op quest chats (M2). New events arrive over
      Centrifugo on the user's personal channel (`RealtimeEvent`, ADR 0007); REST stays the
      source of truth after a reconnect.
  - name: recipes
    description: |
      Cooking quests (M5, ADR 0012): recipes from our own catalog, scaled amounts and a
      shopping list; a recipe becomes a shared plan of a shopper and a cook.
  - name: assistant
    description: |
      The day chat with the assistant (M6, ADR 0013): it starts with the check-in, has a topic
      per quest, and every place, recipe or quest on its cards comes from code.
  - name: events
    description: |
      Listings of the user's region (ADR 0008, 0015): the "top nearby" picks (ADR 0016).
  - name: system
    description: Service health.

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '503':
          $ref: '#/components/responses/Problem'

  /auth/telegram:
    post:
      tags: [auth]
      operationId: signInWithTelegram
      summary: Exchange Telegram Mini App initData for an access token (US-01)
      description: |
        Validates the initData HMAC signature with the bot token and rejects data older
        than 24 hours. The first call creates the user. initData is never logged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Raw `Telegram.WebApp.initData` string.
                  maxLength: 4096
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /auth/email/start:
    post:
      tags: [auth]
      operationId: startEmailSignIn
      summary: Send a one-time sign-in code to an email (ADR 0009)
      description: |
        Sends a 6-digit code valid for 10 minutes. The answer is the same whether or not an
        account with this email exists. A new code replaces the previous one. At most one code
        a minute and 5 an hour per email, and 20 an hour per client address; the email and
        the code are never logged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Code sent
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmailSignIn
      summary: Exchange an email code for a session (ADR 0009)
      description: |
        The first successful sign-in with an email creates the user with an empty
        `first_name`; the client asks for a name during onboarding. A code works once, and
        after 5 wrong attempts it stops working. The session carries a refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /auth/telegram/login-requests:
    post:
      tags: [auth]
      operationId: createTelegramLoginRequest
      summary: Start signing in (or linking Telegram) through the bot from a native app
      description: |
        Returns a link (`t.me/<bot>?startapp=login_<code>`) valid for 5 minutes and a secret
        that only this app knows. The link opens the Mini App, where the user confirms
        (approveTelegramLoginRequest); the app then calls exchangeTelegramLoginRequest with
        the secret. The bot still answers `/start login_<code>` with a confirm button.
        With a bearer token the confirmed Telegram account is linked to the signed-in user
        instead (ADR 0009).
      security:
        - {}
        - bearer: []
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLoginRequest'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /auth/telegram/login-requests/approve:
    post:
      tags: [auth]
      operationId: approveTelegramLoginRequest
      summary: Confirm a native app sign-in from the Mini App
      description: |
        The Mini App opened with `startapp=login_<code>` sends the code with its fresh initData;
        the Telegram user in the verified initData confirms the request. Works without the bot
        receiving updates. 404 when the code is unknown, expired or already confirmed (ADR 0009).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data, code]
              properties:
                init_data:
                  type: string
                  maxLength: 4096
                code:
                  type: string
                  maxLength: 64
                  description: The start parameter without the `login_` prefix.
      responses:
        '204':
          description: Confirmed; the native app picks up its session
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /auth/telegram/login-requests/{request_id}/exchange:
    post:
      tags: [auth]
      operationId: exchangeTelegramLoginRequest
      summary: Get the session once the user confirmed in the bot
      description: |
        202 while the user has not confirmed yet (poll every 2-3 seconds); 200 with a native
        session exactly once after confirmation. A new Telegram account creates the user.
        For a linking request, the session belongs to the user who started it; 409 when this
        Telegram account already belongs to another Ayda account.
      security: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poll_secret]
              properties:
                poll_secret:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '202':
          description: Not confirmed yet
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Exchange a refresh token for a new access token and refresh token
      description: |
        The refresh token is single-use: the response carries a new one. Presenting a used
        token again revokes every token issued from the same sign-in, so a stolen token
        stops working for both sides.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      tags: [auth]
      operationId: signOut
      summary: Revoke a refresh token and every token issued from the same sign-in
      description: Idempotent; an unknown token also returns 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '204':
          description: Signed out
        '422':
          $ref: '#/components/responses/Problem'

  /me:
    get:
      tags: [profile]
      operationId: getMe
      summary: Current user with profile settings and onboarding state
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [profile]
      operationId: requestAccountDeletion
      summary: Request account deletion (152-FZ)
      description: |
        Signs the user out everywhere and schedules erasure of profile, photos and check-ins
        within 30 days; analytics events are anonymized.
      responses:
        '202':
          description: Deletion scheduled
        '401':
          $ref: '#/components/responses/Problem'

  /me/identities:
    get:
      tags: [profile]
      operationId: listMyIdentities
      summary: Ways the user can sign in (email, Telegram)
      responses:
        '200':
          description: Sign-in methods
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignInIdentity'
        '401':
          $ref: '#/components/responses/Problem'

  /me/identities/email:
    post:
      tags: [profile]
      operationId: linkMyEmail
      summary: Link an email after receiving a code from startEmailSignIn
      description: 409 when the email already signs in to another account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInIdentity'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /me/identities/{identity_id}:
    delete:
      tags: [profile]
      operationId: unlinkMyIdentity
      summary: Remove a sign-in method; the last one can't be removed
      parameters:
        - name: identity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /me/devices:
    put:
      tags: [profile]
      operationId: registerMyDevice
      summary: Register this phone's FCM token for push notifications (ADR 0009)
      description: |
        Idempotent per token; call on every app start and when FCM rotates the token. A
        token registered by another user moves to the caller. Pushes carry a generic text
        and `kind` plus ids in their data; the app opens the matching screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [android, ios]
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /me/devices/{device_id}:
    delete:
      tags: [profile]
      operationId: removeMyDevice
      summary: Stop pushes to a phone (call before signing out)
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /me/profile:
    patch:
      tags: [profile]
      operationId: updateProfile
      summary: Update profile settings (US-02, US-03)
      description: Only the fields present are changed. Send `null` for a reminder time to turn it off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /me/onboarding/complete:
    post:
      tags: [profile]
      operationId: completeOnboarding
      summary: Mark onboarding finished (US-02)
      description: Requires an accepted consent, a city and a non-empty `first_name`.
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /me/consents:
    post:
      tags: [profile]
      operationId: acceptConsent
      summary: Accept a version of the personal data processing consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  examples: ['2026-10-16']
      responses:
        '204':
          description: Recorded
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /me/goals:
    get:
      tags: [profile]
      operationId: listMyGoals
      summary: Goals the user picked
      responses:
        '200':
          description: Goal codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalSelection'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      tags: [profile]
      operationId: setMyGoals
      summary: Replace the user's goals (1-5, may be empty when skipped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalSelection'
      responses:
        '200':
          description: Saved goals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalSelection'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /me/habits:
    get:
      tags: [profile]
      operationId: listMyHabits
      summary: User's own "want more" and "want less" habits
      responses:
        '200':
          description: Habits
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [profile]
      operationId: addMyHabit
      summary: Add a habit worded by the user (the app does not judge it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /me/habits/{habit_id}:
    delete:
      tags: [profile]
      operationId: deleteMyHabit
      summary: Remove a habit
      parameters:
        - $ref: '#/components/parameters/HabitId'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /cities:
    get:
      tags: [reference]
      operationId: searchCities
      summary: Find a city by name or by a one-time geolocation (US-02)
      description: |
        Pass `query` to search by name, or `lat` and `lon` to get the nearest cities.
        Coordinates are used for this lookup only and are never stored or logged.
      parameters:
        - name: query
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: lat
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Matching cities, best first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /goals:
    get:
      tags: [reference]
      operationId: listGoals
      summary: Goal catalog for onboarding
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Problem'

  /days/today:
    get:
      tags: [day]
      operationId: getToday
      summary: Today's check-in, quest pool, limits, points and streak (Today screen)
      description: |
        "Today" is the user's local date; a day lasts until 04:00 local time of the next date.
        While `pool.status` is `generating`, poll this endpoint (every 1-2 s).
      responses:
        '200':
          description: Today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
        '401':
          $ref: '#/components/responses/Problem'

  /days/today/checkin:
    put:
      tags: [day]
      operationId: submitCheckin
      summary: Submit or replace today's morning check-in (US-05, US-06)
      description: |
        Starts building the quest pool. A repeated check-in replaces the previous one and
        rebuilds quests that were not taken yet; taken and completed quests stay. The text and
        the assistant's answer also open today's chat with the assistant (ADR 0013).
        The check-in text is visible only to its author and never logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinInput'
      responses:
        '202':
          description: Accepted; the pool is being built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /day-quests:
    post:
      tags: [day]
      operationId: addOwnQuest
      summary: Add an own quest for today; it is taken right away (US-08)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnQuestInput'
      responses:
        '201':
          description: Created and taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayQuest'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          description: Daily limit of taken quests reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /day-quests/{quest_id}/take:
    post:
      tags: [day]
      operationId: takeQuest
      summary: Take an offered quest (US-07)
      parameters:
        - $ref: '#/components/parameters/QuestId'
      responses:
        '200':
          description: Taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayQuest'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Not offered anymore, or the daily limit of 3 is reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /day-quests/{quest_id}/replace:
    post:
      tags: [day]
      operationId: replaceQuest
      summary: '"Not today": swap an offered quest for an alternative (US-07)'
      description: |
        The alternative comes from another category or duration. Up to 5 replacements a day;
        a replaced quest does not come back the same day.
      parameters:
        - $ref: '#/components/parameters/QuestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  $ref: '#/components/schemas/RejectReason'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                required: [replaced, replacement, replacements_left]
                properties:
                  replaced:
                    $ref: '#/components/schemas/DayQuest'
                  replacement:
                    description: Null when no suitable alternative is left in the catalog today.
                    oneOf:
                      - $ref: '#/components/schemas/DayQuest'
                      - type: 'null'
                  replacements_left:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Quest is not in the offered state, or no replacements left
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /day-quests/{quest_id}/complete:
    post:
      tags: [day]
      operationId: completeQuest
      summary: Mark a taken quest done with a visibility level (US-09, US-15)
      description: |
        `friends` visibility creates a proof in the feed, with 0-3 uploaded photos in `ready`
        or `processing` state (a text-only proof is fine); `personal` creates nothing in the
        feed. `routine` is no longer accepted (422). Allowed until the quest's `expires_at`.
      parameters:
        - $ref: '#/components/parameters/QuestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteQuestInput'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Not taken, already completed or expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /conversations/{conversation_id}/meetup:
    post:
      tags: [chat]
      operationId: suggestMeetup
      summary: 'Suggest a meetup from the last messages of a chat ("Айда, организуй", M5)'
      description: |
        Called only on an explicit tap. The last few messages of the chat go to the assistant,
        which only says what kind of meetup it is, which venue kinds fit and at what time;
        nothing is stored or logged from them. Code picks up to 5 venues near the center of
        the caller's city from OpenStreetMap, open at the planned time first. Cards for
        venues carry links to 2GIS and Yandex Maps search, where reviews and the average
        bill are, and must show `attribution`. Plans last one day, so the time is today.
        Without a working assistant, code suggests cafes at 19:00 (`source` is `code`).
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: The card; `note` explains an empty one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetupOffer'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /conversations/{conversation_id}/meetup/pick:
    post:
      tags: [chat]
      operationId: pickMeetup
      summary: Make the chosen venue (or online activity) a co-op with everyone in the chat
      description: |
        Creates a `same` co-op like `createPlan`, with the venue as its place, `starts_at`
        as its time and the other members of the chat invited (up to 3).
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetupPick'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: Someone in the chat is not a friend
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The daily limit of taken quests is reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /recipes/suggest:
    post:
      tags: [recipes]
      operationId: suggestRecipes
      summary: Suggest 2-3 recipes for a cooking quest (M5, ADR 0012)
      description: |
        Code filters the recipe catalog by meal, time, vegetarian diet and the allergens the
        caller named (recipes containing them are dropped); the assistant only picks 2-3 of the
        candidates and says why. Nothing about the caller goes into the prompt. Without a
        working assistant, code takes the first candidates (`source` is `code`). The app never
        claims a dish is safe: each card lists its allergens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeSuggestInput'
      responses:
        '200':
          description: The cards; `note` explains an empty one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeOffer'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /recipes/{recipe_id}:
    get:
      tags: [recipes]
      operationId: getRecipe
      summary: A recipe with amounts for the given number of servings
      parameters:
        - name: recipe_id
          in: path
          required: true
          schema:
            type: string
        - name: servings
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 2
      responses:
        '200':
          description: The recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /recipes/{recipe_id}/quest:
    post:
      tags: [recipes]
      operationId: cookRecipeQuest
      summary: Cook a recipe on your own
      description: |
        Adds an own quest for today, taken right away: "Готовим: <recipe>", with the recipe,
        its allergens and what to buy in `description`. Quests are solo by default; any quest,
        this one too, can be made a shared one with the usual invite (ADR 0014). For a plan
        with a friend that splits shopping and cooking use `planRecipe`.
      parameters:
        - name: recipe_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeQuestInput'
      responses:
        '201':
          description: Created and taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayQuest'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The daily limit of taken quests is reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /recipes/{recipe_id}/plan:
    post:
      tags: [recipes]
      operationId: planRecipe
      summary: Make a recipe a shared plan with a friend
      description: |
        Creates a `parts` co-op like `createPlan`: part 1 "Купить продукты" (the shopping list
        as its checklist, without ingredients listed in `at_home`, optional ones and staples)
        for the shopper, part 2 "Приготовить" (the steps as its checklist) for the cook, opened
        when the shopping is done. The shopper can hand the list to the partner with
        `offerHandoff`. When nothing needs buying, the result is a `same` co-op.
      parameters:
        - name: recipe_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipePlanInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: Not a friend
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The daily limit of taken quests is reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /events/top:
    get:
      tags: [events]
      operationId: listTopEvents
      summary: The most notable events of the user's region in the next two weeks (ADR 0016)
      description: |
        Chosen by code without the user's tastes: public places, free entry, long or repeated
        runs, mass-event words and the season (holidays). One event per title, best first, at
        most 6. Empty when the profile has no city or the listings have nothing.
      responses:
        '200':
          description: The picks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopEvents'
        '401':
          $ref: '#/components/responses/Problem'

  /assistant/messages:
    get:
      tags: [assistant]
      operationId: listAssistantMessages
      summary: Today's chat with the assistant, oldest first (M6, ADR 0013)
      description: |
        Without `quest_id` this is the day topic, which starts with the check-in; with it, the
        topic of that quest of today. The chat ends with the day and is deleted after it.
      parameters:
        - name: quest_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The topic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantThread'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [assistant]
      operationId: sendAssistantMessage
      summary: Write to the assistant and get its answer
      description: |
        The request waits for the answer (up to about 12 s). The assistant gets only the last
        messages of the topic, mood, goals, weather and the quest, never the name or city; the
        text is not logged. Without a working assistant, code answers obvious requests itself
        (`source` is `code`). At most 40 messages a day (`assistant-limit`, 429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantMessageInput'
      responses:
        '201':
          description: The sent message and the answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantExchange'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /day-quests/{quest_id}/coop:
    post:
      tags: [coop]
      operationId: createCoop
      summary: Invite 1-3 friends to do a taken quest together, each on their own (US-18)
      description: |
        The quest must be the user's own taken quest of today that is not part of a co-op yet.
        Friends get a bot message and a `coop.updated` event; the co-op gets a shared chat.
      parameters:
        - $ref: '#/components/parameters/QuestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friend_ids]
              properties:
                friend_ids:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: Someone in `friend_ids` is not a friend
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The quest is not taken, already completed or expired, or already a co-op
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /coops:
    get:
      tags: [coop]
      operationId: listCoops
      summary: Co-op quests of the user that are not over yet, invitations first (US-18)
      description: Declined invitations are left out.
      responses:
        '200':
          description: Co-op quests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'

    post:
      tags: [coop]
      operationId: createPlan
      summary: Create a shared plan directly (M5, ADR 0010)
      description: |
        Without `parts`, a `same` co-op: everyone does the same quest, with an optional place
        and time; the owner gets it as taken (it counts toward the daily limit). With 2-5
        `parts`, a `parts` co-op: each part has an assignee (the owner or an invited friend),
        a place, a time, a checklist and optionally `opens_after`, the index of an earlier
        part that must be done first. Parts that wait for nobody open at once. Part quests
        do not count toward the daily limit. Friends get a bot message and `coop.updated`;
        the plan gets a shared chat and ends with the owner's day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoopCreateInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: Someone in `friend_ids` is not a friend
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A `same` co-op and the daily limit of taken quests is reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /coops/{coop_id}:
    get:
      tags: [coop]
      operationId: getCoop
      summary: One co-op quest the user owns or is invited to
      parameters:
        - $ref: '#/components/parameters/CoopId'
      responses:
        '200':
          description: Co-op quest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /coops/{coop_id}/accept:
    post:
      tags: [coop]
      operationId: acceptCoop
      summary: Join a co-op quest; it is added to today's quests as taken (US-18)
      description: Counts toward the daily limit of taken quests. Joins the co-op chat.
      parameters:
        - $ref: '#/components/parameters/CoopId'
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Already answered, or the daily limit of taken quests is reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: The co-op quest is over
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /coops/{coop_id}/decline:
    post:
      tags: [coop]
      operationId: declineCoop
      summary: Decline an invitation to a co-op quest
      parameters:
        - $ref: '#/components/parameters/CoopId'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Already answered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /coops/{coop_id}/parts/{part_id}/items/{item_id}:
    patch:
      tags: [coop]
      operationId: setCoopItem
      summary: Tick or untick a checklist item of a part (ADR 0010)
      description: Only the part's assignee, while the part is open. Unticked items never block completing a part.
      parameters:
        - $ref: '#/components/parameters/CoopId'
        - $ref: '#/components/parameters/PartId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: The part is assigned to someone else
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The part is still locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /coops/{coop_id}/parts/{part_id}/handoff:
    post:
      tags: [coop]
      operationId: offerHandoff
      summary: Offer a part to a friend (ADR 0010)
      description: |
        The current assignee of a part that is not done offers it to a friend. The friend gets
        a bot or push message of kind `coop.handoff` and answers with accept or decline.
        One offer per part at a time.
      parameters:
        - $ref: '#/components/parameters/CoopId'
        - $ref: '#/components/parameters/PartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friend_id]
              properties:
                friend_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Offered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: Not a friend, or the part is assigned to someone else
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The part is done or already offered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: The plan is over
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [coop]
      operationId: withdrawHandoff
      summary: Withdraw an offer that is waiting for an answer
      parameters:
        - $ref: '#/components/parameters/CoopId'
        - $ref: '#/components/parameters/PartId'
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: The part is assigned to someone else
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /coops/{coop_id}/parts/{part_id}/handoff/accept:
    post:
      tags: [coop]
      operationId: acceptHandoff
      summary: Take over a part offered to you (ADR 0010)
      description: |
        The friend joins the co-op and its chat if not yet in it and becomes the assignee. If
        the part is open, the previous assignee's quest for it is removed without points or
        penalty and the friend gets a quest. Quests of parts are outside the daily limit.
      parameters:
        - $ref: '#/components/parameters/CoopId'
        - $ref: '#/components/parameters/PartId'
      responses:
        '200':
          description: Taken over
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The plan already has four participants
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: The plan is over
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /coops/{coop_id}/parts/{part_id}/handoff/decline:
    post:
      tags: [coop]
      operationId: declineHandoff
      summary: Decline a part offered to you
      description: Nothing changes for the plan. The response shows it as the decliner saw it, with `my_status` `declined` if they are not a participant.
      parameters:
        - $ref: '#/components/parameters/CoopId'
        - $ref: '#/components/parameters/PartId'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coop'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /media/uploads:
    post:
      tags: [media]
      operationId: createUpload
      summary: Get a presigned URL to upload one photo to S3 (US-10)
      description: |
        Upload the file with a `PUT` to `upload_url` and the given headers before `expires_at`,
        then pass `media_id` to completeQuest. EXIF is stripped before anyone can see the photo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size_bytes]
              properties:
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/heic, image/webp]
                size_bytes:
                  type: integer
                  minimum: 1
                  maximum: 10485760
      responses:
        '201':
          description: Upload slot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSlot'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /feed:
    get:
      tags: [social]
      operationId: getFeed
      summary: Proofs and routines of the user and their friends, newest first (US-13)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
        '401':
          $ref: '#/components/responses/Problem'

  /posts/{post_id}:
    delete:
      tags: [social]
      operationId: deletePost
      summary: Delete own post; its photos are deleted from storage, points stay (US-10)
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /posts/{post_id}/like:
    put:
      tags: [social]
      operationId: likePost
      summary: Like a post (idempotent, US-14)
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [social]
      operationId: unlikePost
      summary: Remove a like (idempotent)
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Like removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /posts/{post_id}/comments:
    get:
      tags: [social]
      operationId: listComments
      summary: Comments on a post, oldest first (US-14)
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [social]
      operationId: addComment
      summary: Comment on a post (US-14)
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /comments/{comment_id}:
    delete:
      tags: [social]
      operationId: deleteComment
      summary: Delete a comment (its author or the post author)
      parameters:
        - name: comment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /invites:
    post:
      tags: [social]
      operationId: createInvite
      summary: Create a reusable 7-day invite link (US-12)
      responses:
        '201':
          description: Invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /invites/{code}/accept:
    post:
      tags: [social]
      operationId: acceptInvite
      summary: Become friends with the inviter (idempotent, US-12)
      description: >-
        Called by the Mini App when it starts with a `startapp` invite code, and by the native
        apps when an `/i/<code>` link opens them.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 64
      responses:
        '200':
          description: Friendship exists (created now or before)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Own invite
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Invite expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /friends:
    get:
      tags: [social]
      operationId: listFriends
      summary: The user's friends
      responses:
        '200':
          description: Friends, by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Friend'
        '401':
          $ref: '#/components/responses/Problem'

  /friends/{user_id}:
    delete:
      tags: [social]
      operationId: removeFriend
      summary: End a friendship; the former friend stops seeing posts at once (US-12)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /ladder:
    get:
      tags: [social]
      operationId: getLadder
      summary: Weekly ranking of the user and their friends (US-16)
      description: |
        Each user's week starts on Monday 00:00 in their own time zone. Points for personal
        quests are included without details. Ties go to the longer streak.
      parameters:
        - name: week
          in: query
          schema:
            type: string
            enum: [current, previous]
            default: current
      responses:
        '200':
          description: Ladder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ladder'
        '401':
          $ref: '#/components/responses/Problem'

  /realtime/token:
    post:
      tags: [chat]
      operationId: getRealtimeToken
      summary: Centrifugo connection token for the user's personal channel (ADR 0007)
      description: |
        Connect to `url` with `token`, subscribe to `channel` with recovery on, and call this
        again when Centrifugo asks to refresh the token. Events on the channel are
        `RealtimeEvent` objects.
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeToken'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          description: Realtime is not configured on this server
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /conversations:
    get:
      tags: [chat]
      operationId: listConversations
      summary: The user's chats with unread counts, latest activity first (US-17)
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Problem'

  /conversations/direct:
    post:
      tags: [chat]
      operationId: openDirectConversation
      summary: Open the direct chat with a friend, creating it on first use (idempotent, US-17)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The direct conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: Not friends (only friends can start a chat)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /conversations/{conversation_id}:
    get:
      tags: [chat]
      operationId: getConversation
      summary: One conversation of the user
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /conversations/{conversation_id}/messages:
    get:
      tags: [chat]
      operationId: listMessages
      summary: Message history, newest first; pass `next_cursor` for older pages (US-17)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    post:
      tags: [chat]
      operationId: sendMessage
      summary: Send a message; members get it over Centrifugo (US-17)
      description: |
        `client_id` makes retries safe: a second request with the same `client_id` returns the
        message saved the first time with status 200. The bot tells offline members that a new
        message arrived, without its text.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '201':
          description: Saved and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '200':
          description: Already saved earlier with this `client_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: The chat is closed for new messages (the friendship was removed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /conversations/{conversation_id}/messages/{message_id}:
    delete:
      tags: [chat]
      operationId: deleteMessage
      summary: Delete own message for everyone
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /conversations/{conversation_id}/read:
    post:
      tags: [chat]
      operationId: markConversationRead
      summary: Mark messages up to `last_read_message_id` as read (never moves back)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last_read_message_id]
              properties:
                last_read_message_id:
                  type: integer
                  format: int64
      responses:
        '204':
          description: Saved
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token from signInWithTelegram, verifyEmailSignIn or refreshSession.

  parameters:
    QuestId:
      name: quest_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: post_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CoopId:
      name: coop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartId:
      name: part_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    HabitId:
      name: habit_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A stable error code URI, e.g. `https://ayda.app/errors/daily-limit-reached`.
        title:
          type: string
          description: Short human-readable summary in Russian.
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          description: Field errors for 422.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Session:
      type: object
      required: [access_token, expires_at, user]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: [string, 'null']
          description: |
            Only in native sessions (email sign-in and refreshSession). Single-use; keep it
            in the platform's secure storage. Null or missing for Mini App sign-in.
        refresh_expires_at:
          type: [string, 'null']
          format: date-time
          description: When `refresh_token` expires (60 days after it was issued).
        user:
          $ref: '#/components/schemas/Me'

    NotificationChannel:
      type: string
      enum: [auto, push, telegram]
      description: |
        Where reminders and notices go: `auto` pushes to phones with the app and uses the
        Telegram bot otherwise; `push` only pushes; `telegram` only uses the bot. New users
        start with `auto`. Clients send it only to change it: generated clients that fill in
        a schema default would otherwise reset the choice on every profile update.

    Device:
      type: object
      required: [id, platform, created_at]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android, ios]
        created_at:
          type: string
          format: date-time

    TelegramLoginRequest:
      type: object
      required: [id, poll_secret, bot_url, expires_at]
      properties:
        id:
          type: string
          format: uuid
        poll_secret:
          type: string
          description: Shown once; keep it in memory and send it to exchangeTelegramLoginRequest.
        bot_url:
          type: string
          format: uri
          examples: ['https://t.me/ayda_quest_bot?startapp=login_x8Kq2LmN0pQr7sTu']
        expires_at:
          type: string
          format: date-time

    SignInIdentity:
      type: object
      required: [id, provider, label, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [telegram, email]
        label:
          type: string
          description: The email itself, or "Telegram".
        created_at:
          type: string
          format: date-time

    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          maxLength: 256

    Theme:
      type: string
      enum: [graphite, plum]

    Me:
      type: object
      required: [id, first_name, theme, timezone, reminders, consent_required, onboarded]
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          description: Empty for a new user who signed in by email until they set a name.
        last_name:
          type: [string, 'null']
        username:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
          format: uri
        city:
          oneOf:
            - $ref: '#/components/schemas/City'
            - type: 'null'
        timezone:
          type: string
          description: IANA time zone derived from the city.
          examples: [Europe/Kaliningrad]
        theme:
          $ref: '#/components/schemas/Theme'
        reminders:
          $ref: '#/components/schemas/Reminders'
        consent_required:
          type: [string, 'null']
          description: Consent version the user must accept before anything else, or null.
        onboarded:
          type: boolean
        notification_channel:
          $ref: '#/components/schemas/NotificationChannel'

    Reminders:
      type: object
      required: [morning_at, evening_at]
      properties:
        morning_at:
          description: Local time `HH:MM`, or null when off.
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          examples: ['08:30']
        evening_at:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          examples: ['20:30']

    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Leading and trailing spaces are trimmed.
        city_id:
          type: integer
        theme:
          $ref: '#/components/schemas/Theme'
        reminders:
          $ref: '#/components/schemas/Reminders'
        notification_channel:
          $ref: '#/components/schemas/NotificationChannel'

    City:
      type: object
      required: [id, name, region_name, timezone]
      properties:
        id:
          type: integer
        name:
          type: string
          examples: [Калининград]
        region_name:
          type: string
          examples: [Калининградская область]
        timezone:
          type: string

    Goal:
      type: object
      required: [code, title]
      properties:
        code:
          type: string
          examples: [more_movement]
        title:
          type: string
          examples: [Больше двигаться]

    GoalSelection:
      type: object
      required: [goal_codes]
      properties:
        goal_codes:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string

    HabitDirection:
      type: string
      enum: [more, less]
      description: '`more` = "want more", `less` = "want less".'

    HabitCreate:
      type: object
      required: [direction, text]
      properties:
        direction:
          $ref: '#/components/schemas/HabitDirection'
        text:
          type: string
          minLength: 1
          maxLength: 100

    Habit:
      allOf:
        - $ref: '#/components/schemas/HabitCreate'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    Mood:
      type: string
      enum: [energetic, normal, tired]

    CheckinInput:
      type: object
      required: [mood]
      properties:
        text:
          type: string
          maxLength: 1000
          default: ''
        mood:
          $ref: '#/components/schemas/Mood'

    Checkin:
      type: object
      required: [text, mood, submitted_at]
      properties:
        text:
          type: string
          description: Visible only to its author; empty after the 30-day retention.
        mood:
          $ref: '#/components/schemas/Mood'
        submitted_at:
          type: string
          format: date-time

    Category:
      type: string
      enum: [sport, walk, city, rest, project, social, home, learning]

    Visibility:
      type: string
      enum: [personal, routine, friends]
      description: >-
        `routine` is kept only for quests completed before it was retired; new completions
        use `friends` (in the feed) or `personal` (only me).

    RejectReason:
      type: string
      enum: [no_time, dont_want, cant]

    QuestState:
      type: string
      enum: [offered, taken, replaced, completed, expired]

    QuestSource:
      type: string
      enum: [catalog, checkin_task, custom, coop, event]
      description: |
        `coop`: joined from a friend's co-op invitation. `event`: a local event from the
        listings (US-19); details are in `DayQuest.event`.

    DayQuest:
      type: object
      required: [id, source, title, category, duration_min, base_points, state, expires_at]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/QuestSource'
        title:
          type: string
        description:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/Category'
        duration_min:
          type: integer
          minimum: 1
        base_points:
          type: integer
          description: Points before visibility and streak multipliers.
        why:
          type: [string, 'null']
          description: One "why you" line.
        outdoor:
          type: boolean
        state:
          $ref: '#/components/schemas/QuestState'
        visibility:
          oneOf:
            - $ref: '#/components/schemas/Visibility'
            - type: 'null'
        points_awarded:
          type: [integer, 'null']
          description: Includes the co-op bonus once it is awarded.
        coop_id:
          type: [string, 'null']
          format: uuid
          description: The co-op this quest belongs to (as its owner or a participant).
        event:
          description: Set only for `source = event`.
          oneOf:
            - $ref: '#/components/schemas/EventInfo'
            - type: 'null'
        expires_at:
          type: string
          format: date-time

    EventInfo:
      type: object
      description: |
        A local event behind an event quest (US-19), as of when the pool was built. The
        client shows the place, time, price and a link to the source page, and names the
        source (ADR 0008).
      required: [title, starts_at, is_free, url, source]
      properties:
        title:
          type: string
          description: The event's own title; the quest title may be phrased differently.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        venue:
          type: [string, 'null']
          description: Place name, for example a club or a museum.
        address:
          type: [string, 'null']
        city:
          type: [string, 'null']
          description: City name; shown when the event is in another city of the user's region.
        is_free:
          type: boolean
        price_min:
          type: [integer, 'null']
          minimum: 0
          description: Lowest ticket price in rubles when known; null for free events or unknown price.
        url:
          type: string
          format: uri
          description: The event page at the source; open it in the external browser.
        source:
          type: string
          enum: [timepad, kudago, culture]
          description: '`timepad` (Timepad), `kudago` (KudaGo), `culture` (PRO.Культура.РФ).'

    PoolStatus:
      type: string
      enum: [none, generating, ready, failed]
      description: '`none` until the check-in; `failed` still returns the code-only pool when possible.'

    Weather:
      type: object
      required: [temperature_c, condition]
      properties:
        temperature_c:
          type: number
        condition:
          type: string
          enum: [clear, cloudy, rain, snow, storm, unknown]

    Streak:
      type: object
      required: [current_days, best_days, freeze_available]
      properties:
        current_days:
          type: integer
          minimum: 0
        best_days:
          type: integer
          minimum: 0
        freeze_available:
          type: boolean
          description: Whether this week's automatic freeze is still unused.

    Day:
      type: object
      required: [local_date, checkin, pool_status, quests, limits, points_today, points_week, streak]
      properties:
        local_date:
          type: string
          format: date
        checkin:
          oneOf:
            - $ref: '#/components/schemas/Checkin'
            - type: 'null'
        pool_status:
          $ref: '#/components/schemas/PoolStatus'
        weather:
          oneOf:
            - $ref: '#/components/schemas/Weather'
            - type: 'null'
        quests:
          type: array
          description: Offered, taken, completed and expired quests of the day in pool order; replaced quests are omitted.
          items:
            $ref: '#/components/schemas/DayQuest'
        limits:
          type: object
          required: [taken, max_taken, scored, max_scored, replacements_left]
          properties:
            taken:
              type: integer
              minimum: 0
            max_taken:
              type: integer
              description: A guard against abuse, not a rule users meet (there is no real limit).
              examples: [30]
            scored:
              type: integer
              minimum: 0
              description: Completed quests of the day that brought points.
            max_scored:
              type: integer
              description: Only the first this many completed quests of a day bring points.
              examples: [5]
            replacements_left:
              type: integer
              minimum: 0
        points_today:
          type: integer
        points_week:
          type: integer
        streak:
          $ref: '#/components/schemas/Streak'

    OwnQuestInput:
      type: object
      required: [title, category, duration_min]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        category:
          $ref: '#/components/schemas/Category'
        duration_min:
          type: integer
          minimum: 5
          maximum: 480

    CompleteQuestInput:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'
        caption:
          type: string
          maxLength: 500
          description: Only for `friends` visibility.
        media_ids:
          type: array
          description: Optional (0-3) for `friends` visibility, must be empty otherwise.
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            format: uuid

    Completion:
      type: object
      required: [quest, points_awarded, points_breakdown, streak, post_id]
      properties:
        quest:
          $ref: '#/components/schemas/DayQuest'
        points_awarded:
          type: integer
        points_breakdown:
          type: object
          required: [base, visibility_multiplier, streak_multiplier]
          properties:
            base:
              type: integer
            visibility_multiplier:
              type: number
            streak_multiplier:
              type: number
        streak:
          $ref: '#/components/schemas/Streak'
        post_id:
          description: The feed post, or null for personal visibility.
          type: [string, 'null']
          format: uuid
        coop_bonus:
          type: integer
          minimum: 0
          description: |
            Co-op bonus awarded to the user with this completion (+50% of `points_awarded`)
            when it was the last one the co-op waited for; 0 otherwise.

    UploadSlot:
      type: object
      required: [media_id, upload_url, headers, expires_at]
      properties:
        media_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers to send with the PUT.
        expires_at:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, first_name]
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri

    Photo:
      type: object
      required: [id, url, width, height]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Short-lived signed URL; do not cache beyond its lifetime.
        width:
          type: integer
        height:
          type: integer

    Post:
      type: object
      required: [id, author, kind, category, local_date, created_at, photos, like_count, liked_by_me, comment_count]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummary'
        kind:
          type: string
          enum: [proof, routine]
          description: '`routine` (older entries only) shows only the category, without title, caption or photos.'
        quest_title:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/Category'
        caption:
          type: [string, 'null']
        photos:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Photo'
        local_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        like_count:
          type: integer
        liked_by_me:
          type: boolean
        comment_count:
          type: integer

    PostPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        next_cursor:
          type: [string, 'null']

    LikeState:
      type: object
      required: [like_count, liked_by_me]
      properties:
        like_count:
          type: integer
        liked_by_me:
          type: boolean

    Comment:
      type: object
      required: [id, author, text, created_at, can_delete]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummary'
        text:
          type: string
        created_at:
          type: string
          format: date-time
        can_delete:
          type: boolean

    CommentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        next_cursor:
          type: [string, 'null']

    Invite:
      type: object
      required: [code, url, expires_at]
      properties:
        code:
          type: string
        url:
          type: string
          format: uri
          description: >-
            `https://<domain>/i/<code>` in production (opens the native app when installed, else the
            Telegram bot); `https://t.me/<bot>?startapp=<code>` where no public origin is configured.
          examples: ['https://ayda.example.ru/i/k3J9xQ2mLp']
        expires_at:
          type: string
          format: date-time

    Friend:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [since]
          properties:
            since:
              type: string
              format: date-time

    LadderEntry:
      type: object
      required: [rank, user, points, streak_days, is_me]
      properties:
        rank:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/UserSummary'
        points:
          type: integer
        streak_days:
          type: integer
        is_me:
          type: boolean

    Ladder:
      type: object
      required: [week_start, entries]
      properties:
        week_start:
          type: string
          format: date
          description: Monday of the requesting user's local week.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LadderEntry'

    RealtimeToken:
      type: object
      required: [token, expires_at, url, channel]
      properties:
        token:
          type: string
          description: Centrifugo connection JWT.
        expires_at:
          type: string
          format: date-time
        url:
          type: string
          description: Centrifugo WebSocket endpoint.
          examples: ['wss://ayda.example/connection/websocket']
        channel:
          type: string
          description: The user's personal channel.
          examples: ['personal:#01890a5d-ac96-774b-bcce-b302099a8057']

    CoopStatus:
      type: string
      enum: [owner, invited, accepted, declined]

    CoopParticipant:
      type: object
      required: [user, status, completed]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        status:
          $ref: '#/components/schemas/CoopStatus'
        completed:
          type: boolean

    MeetupVenue:
      type: object
      required: [id, name, kind, address, distance_m, opening_hours, open_now, osm_url, gis_url, yandex_url]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [restaurant, cafe, bar, pub, fast_food]
        address:
          type: [string, 'null']
        distance_m:
          type: integer
          description: From the city center.
        opening_hours:
          type: [string, 'null']
          description: OpenStreetMap `opening_hours` as written there.
        open_now:
          type: [boolean, 'null']
          description: Open at the planned time; null when the hours are unknown.
        osm_url:
          type: string
          format: uri
        gis_url:
          type: string
          format: uri
          description: 2GIS search for the venue; reviews and the average bill are there.
        yandex_url:
          type: string
          format: uri
          description: Yandex Maps search for the venue.

    MeetupOffer:
      type: object
      required: [kind, source, starts_at, activity, venues, note, attribution]
      properties:
        kind:
          type: string
          enum: [venue, online, unclear]
        source:
          type: string
          enum: [llm, code]
          description: Who read the chat; `code` when the assistant was unavailable.
        starts_at:
          type: [string, 'null']
          format: date-time
          description: Today, at least 30 minutes ahead; null when `kind` is `unclear` or it is too late.
        activity:
          type: [string, 'null']
          description: For `online`, such as a game.
        venues:
          type: array
          items:
            $ref: '#/components/schemas/MeetupVenue'
        note:
          type: [string, 'null']
          description: Why the card is empty, in Russian.
        attribution:
          type: [string, 'null']
          description: Must be shown with the venues (ODbL).

    MeetupPick:
      type: object
      required: [starts_at]
      description: Exactly one of `venue_id` and `activity`.
      properties:
        venue_id:
          type: [integer, 'null']
          format: int64
        activity:
          type: [string, 'null']
          minLength: 1
          maxLength: 60
        starts_at:
          type: string
          format: date-time
          description: Before the end of the day.

    Meal:
      type: string
      enum: [breakfast, lunch, dinner, snack, dessert]

    Allergen:
      type: string
      enum: [gluten, milk, egg, fish, shellfish, nuts, peanut, soy, sesame]

    RecipeSuggestInput:
      type: object
      properties:
        meal:
          anyOf:
            - $ref: '#/components/schemas/Meal'
            - type: 'null'
        max_minutes:
          type: [integer, 'null']
          minimum: 10
          maximum: 240
        allergens:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/Allergen'
        vegetarian:
          type: boolean
          default: false

    AssistantMessageInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        quest_id:
          type: [string, 'null']
          format: uuid
          description: A quest of today; its topic instead of the day topic.

    AssistantPlace:
      type: object
      required: [id, name, kind, address, distance_m, open_now, osm_url, gis_url, yandex_url]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [restaurant, cafe, bar, pub, fast_food, park, garden, embankment, viewpoint, square]
        address:
          type: [string, 'null']
        distance_m:
          type: integer
          description: From the city center.
        open_now:
          type: [boolean, 'null']
          description: Null when the hours are unknown or the place has none.
        osm_url:
          type: string
          format: uri
        gis_url:
          type: string
          format: uri
        yandex_url:
          type: string
          format: uri

    AssistantCard:
      type: object
      description: Facts the assistant asked code for. Only the field of `kind` is filled.
      required: [kind, places, events, recipes, quest, note, attribution]
      properties:
        kind:
          type: string
          enum: [places, events, dishes, quest]
        places:
          type: array
          items:
            $ref: '#/components/schemas/AssistantPlace'
        events:
          type: array
          description: >-
            Up to 5 listings of the user's region (or of a town in it the user named), the best
            fit for the request and the user's goals first (ADR 0015).
          maxItems: 5
          items:
            $ref: '#/components/schemas/AssistantEvent'
        recipes:
          type: array
          description: Open one with `getRecipe`; the cooking plan of M5 takes it from there.
          items:
            $ref: '#/components/schemas/RecipeCard'
        quest:
          description: >-
            The quest as it was offered; take it with `takeQuest`, its current state is in the
            day (`getToday`).
          oneOf:
            - $ref: '#/components/schemas/DayQuest'
            - type: 'null'
        note:
          type: [string, 'null']
          description: Why the card is empty or what to keep in mind, e.g. no city in the profile.
        attribution:
          type: [string, 'null']
          description: Data credit to show under the card, e.g. for OpenStreetMap.

    AssistantEvent:
      type: object
      description: An event from the listings (Timepad, KudaGo); every field comes from code.
      required: [id, title, starts_at, ends_at, venue, address, city, distance_km, category, is_free, price_min, url, source]
      properties:
        id:
          type: integer
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        venue:
          type: [string, 'null']
        address:
          type: [string, 'null']
        city:
          type: string
          description: Town of the event.
        distance_km:
          type: number
          description: From the center of the searched town.
        category:
          $ref: '#/components/schemas/Category'
        is_free:
          type: boolean
        price_min:
          type: [integer, 'null']
          description: Cheapest ticket in rubles, when known.
        url:
          type: string
          description: The event page at its source.
        source:
          type: string
          enum: [timepad, kudago]

    AssistantMessage:
      type: object
      required: [id, role, text, quest_id, source, cards, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
        quest_id:
          type: [string, 'null']
          format: uuid
        source:
          type: [string, 'null']
          enum: [llm, code, null]
          description: Who wrote an assistant message; null for the user's own.
        cards:
          type: array
          items:
            $ref: '#/components/schemas/AssistantCard'
        created_at:
          type: string
          format: date-time

    TopEvents:
      type: object
      required: [items, attribution]
      properties:
        items:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/AssistantEvent'
        attribution:
          type: string

    AssistantThread:
      type: object
      required: [items, messages_left]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssistantMessage'
        messages_left:
          type: integer
          description: How many more messages the user can send today.

    AssistantExchange:
      type: object
      required: [sent, reply, messages_left]
      properties:
        sent:
          $ref: '#/components/schemas/AssistantMessage'
        reply:
          $ref: '#/components/schemas/AssistantMessage'
        messages_left:
          type: integer

    RecipeCard:
      type: object
      required: [id, title, meal, minutes, servings, allergens, vegetarian, why]
      properties:
        id:
          type: string
        title:
          type: string
        meal:
          $ref: '#/components/schemas/Meal'
        minutes:
          type: integer
        servings:
          type: integer
          description: The servings the catalog amounts are written for.
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/Allergen'
        vegetarian:
          type: boolean
        why:
          type: [string, 'null']
          description: One Russian sentence from the assistant; null when code picked.

    RecipeOffer:
      type: object
      required: [source, recipes, note]
      properties:
        source:
          type: string
          enum: [llm, code]
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeCard'
        note:
          type: [string, 'null']

    RecipeLine:
      type: object
      required: [ingredient, name, amount, unit, aisle, optional, staple]
      properties:
        ingredient:
          type: string
        name:
          type: string
        amount:
          type: number
        unit:
          type: string
          enum: [g, ml, pcs, clove, slice, tbsp, tsp, pinch]
        aisle:
          type: string
          enum: [produce, dairy, meat, fish, grocery, bakery, frozen, drinks, other]
        optional:
          type: boolean
        staple:
          type: boolean
          description: Usually at home (salt, oil); not put on the shopping list.

    RecipeDetail:
      type: object
      required: [recipe, servings, lines, steps, note]
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeCard'
        servings:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLine'
        steps:
          type: array
          items:
            type: string
        note:
          type: string
          description: Must be shown with the allergens.

    RecipeQuestInput:
      type: object
      properties:
        servings:
          type: integer
          minimum: 1
          maximum: 8
          default: 2
        at_home:
          type: array
          maxItems: 60
          items:
            type: string
            maxLength: 40
          description: Ingredient ids of the recipe the caller already has.

    RecipePlanInput:
      type: object
      required: [friend_id, shopper]
      properties:
        friend_id:
          type: string
          format: uuid
        shopper:
          type: string
          enum: [me, friend]
          description: Who buys the groceries; the other one cooks.
        servings:
          type: integer
          minimum: 1
          maximum: 8
          default: 2
        at_home:
          type: array
          maxItems: 60
          items:
            type: string
            maxLength: 40
          description: Ingredient ids of the recipe the caller already has.
        starts_at:
          type: [string, 'null']
          format: date-time

    CoopKind:
      type: string
      enum: [same, parts]
      description: |
        `same`: everyone does the same quest. `parts`: the plan is split into parts that differ
        in assignee, place, time, checklist and order (ADR 0010).

    Place:
      type: object
      description: A snapshot of a venue, so a plan stays stable if its source changes.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: [string, 'null']
          maxLength: 200
        lat:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        lon:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        link:
          type: [string, 'null']
          maxLength: 500
          pattern: '^https://'
        source:
          type: [string, 'null']
          maxLength: 32
        source_id:
          type: [string, 'null']
          maxLength: 64
        price_hint:
          type: [string, 'null']
          maxLength: 40

    CoopItem:
      type: object
      required: [id, text, done]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 120
        done:
          type: boolean

    CoopHandoffOffer:
      type: object
      description: A pending offer of a part to a friend.
      required: [to, for_me]
      properties:
        to:
          $ref: '#/components/schemas/UserSummary'
        for_me:
          type: boolean
          description: The offer is for the viewer, who can accept or decline it.

    CoopPart:
      type: object
      required: [id, position, title, category, duration_min, place, starts_at, assignee, state, opens_after, items, my_quest_id, handoff]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        duration_min:
          type: integer
        place:
          oneOf:
            - $ref: '#/components/schemas/Place'
            - type: 'null'
        starts_at:
          type: [string, 'null']
          format: date-time
        assignee:
          $ref: '#/components/schemas/UserSummary'
        state:
          type: string
          enum: [locked, open, done]
          description: A locked part waits for the part in `opens_after`; the assignee has no quest for it yet.
        opens_after:
          type: [string, 'null']
          format: uuid
          description: The id of the part that must be done first.
        items:
          type: array
          description: The checklist (for cooking, the shopping list).
          items:
            $ref: '#/components/schemas/CoopItem'
        my_quest_id:
          type: [string, 'null']
          format: uuid
          description: The viewer's day quest for the part, when they are the assignee and it is open.
        handoff:
          oneOf:
            - $ref: '#/components/schemas/CoopHandoffOffer'
            - type: 'null'

    CoopPartInput:
      type: object
      required: [title, assignee_id]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        category:
          description: The plan's category when omitted.
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        duration_min:
          type: [integer, 'null']
          minimum: 5
          maximum: 480
          description: The plan's duration when omitted.
        assignee_id:
          type: string
          format: uuid
          description: The owner or one of `friend_ids`.
        place:
          oneOf:
            - $ref: '#/components/schemas/Place'
            - type: 'null'
        starts_at:
          type: [string, 'null']
          format: date-time
          description: Before the end of the owner's day.
        opens_after:
          type: [integer, 'null']
          minimum: 0
          description: Index of an earlier part in `parts` that must be done first.
        items:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 120

    CoopCreateInput:
      type: object
      required: [title, category, duration_min, friend_ids]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
        category:
          $ref: '#/components/schemas/Category'
        duration_min:
          type: integer
          minimum: 5
          maximum: 480
        outdoor:
          type: boolean
          default: false
        place:
          oneOf:
            - $ref: '#/components/schemas/Place'
            - type: 'null'
        starts_at:
          type: [string, 'null']
          format: date-time
          description: Before the end of the owner's day.
        friend_ids:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            format: uuid
        parts:
          type: [array, 'null']
          description: 2-5 parts for a `parts` co-op; omit for a `same` one. At least one part must not use `opens_after`.
          minItems: 2
          maxItems: 5
          items:
            $ref: '#/components/schemas/CoopPartInput'

    Coop:
      type: object
      required: [id, title, category, duration_min, owner, my_status, participants, my_quest_id, conversation_id, expires_at, bonus_awarded]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        duration_min:
          type: integer
        owner:
          $ref: '#/components/schemas/UserSummary'
        my_status:
          $ref: '#/components/schemas/CoopStatus'
        participants:
          type: array
          description: Everyone invited, the owner first; declined ones included.
          items:
            $ref: '#/components/schemas/CoopParticipant'
        my_quest_id:
          type: [string, 'null']
          format: uuid
          description: The user's day quest for this co-op, once owner or accepted.
        conversation_id:
          type: [string, 'null']
          format: uuid
          description: The shared chat, for the owner and accepted participants.
        expires_at:
          type: string
          format: date-time
          description: Invitations can be accepted until then (the end of the owner's day).
        bonus_awarded:
          type: boolean
          description: Every participant who joined has completed it, and the +50% was awarded.
        kind:
          $ref: '#/components/schemas/CoopKind'
        place:
          oneOf:
            - $ref: '#/components/schemas/Place'
            - type: 'null'
        starts_at:
          type: [string, 'null']
          format: date-time
        parts:
          type: [array, 'null']
          description: For a `parts` co-op, in order; null for a `same` one.
          items:
            $ref: '#/components/schemas/CoopPart'

    ConversationKind:
      type: string
      enum: [dm, coop]

    Conversation:
      type: object
      required: [id, kind, title, members, can_send, last_message, unread_count, last_read_message_id, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ConversationKind'
        title:
          type: string
          description: The friend's name for `dm`, the quest title for `coop`.
        peer:
          description: The other person in a `dm`; null for `coop`.
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        coop_id:
          type: [string, 'null']
          format: uuid
        members:
          type: array
          description: Everyone in the chat except the user.
          items:
            $ref: '#/components/schemas/UserSummary'
        can_send:
          type: boolean
          description: False once a `dm` friendship is removed; history stays readable.
        last_message:
          oneOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        unread_count:
          type: integer
          minimum: 0
        last_read_message_id:
          type: [integer, 'null']
          format: int64
        updated_at:
          type: string
          format: date-time
          description: Time of the last message, or of creation for an empty chat.

    MessageInput:
      type: object
      required: [text, client_id]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        client_id:
          type: string
          format: uuid
          description: Generated by the client once per message; makes retries idempotent.

    Message:
      type: object
      required: [id, conversation_id, author, text, created_at, client_id]
      properties:
        id:
          type: integer
          format: int64
          description: Grows with time inside a conversation.
        conversation_id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummary'
        text:
          type: string
        created_at:
          type: string
          format: date-time
        client_id:
          type: [string, 'null']
          format: uuid

    MessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type: [string, 'null']

    RealtimeEvent:
      description: |
        A publication on the personal channel (ADR 0007). Clients ignore unknown `type`
        values, so new kinds of events can be added without breaking them.
      oneOf:
        - $ref: '#/components/schemas/MessageCreatedEvent'
        - $ref: '#/components/schemas/MessageDeletedEvent'
        - $ref: '#/components/schemas/ConversationReadEvent'
        - $ref: '#/components/schemas/CoopUpdatedEvent'
      discriminator:
        propertyName: type
        mapping:
          message.created: '#/components/schemas/MessageCreatedEvent'
          message.deleted: '#/components/schemas/MessageDeletedEvent'
          conversation.read: '#/components/schemas/ConversationReadEvent'
          coop.updated: '#/components/schemas/CoopUpdatedEvent'

    MessageCreatedEvent:
      type: object
      required: [type, conversation_id, message]
      properties:
        type:
          type: string
          const: message.created
        conversation_id:
          type: string
          format: uuid
        message:
          $ref: '#/components/schemas/Message'

    MessageDeletedEvent:
      type: object
      required: [type, conversation_id, message_id]
      properties:
        type:
          type: string
          const: message.deleted
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: integer
          format: int64

    ConversationReadEvent:
      type: object
      required: [type, conversation_id, user_id, last_read_message_id]
      properties:
        type:
          type: string
          const: conversation.read
        conversation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        last_read_message_id:
          type: integer
          format: int64

    CoopUpdatedEvent:
      type: object
      required: [type, coop_id]
      description: A co-op the user is in changed (invited, joined, declined, completed, bonus); reload it.
      properties:
        type:
          type: string
          const: coop.updated
        coop_id:
          type: string
          format: uuid
