# Local development: `docker compose up -d` (see backend/README.md).
services:
  postgres:
    build: infra/postgres
    environment:
      POSTGRES_USER: ayda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayda}
      POSTGRES_DB: ayda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/20-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayda -d ayda"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ayda:${POSTGRES_PASSWORD:-ayda}@postgres:5432/ayda
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: backend
    command: ["python", "-m", "ayda.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ayda:${POSTGRES_PASSWORD:-ayda}@postgres:5432/ayda
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy

  # S3-compatible storage for photos in local dev (production: an S3 provider in Russia).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ayda}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-ayda-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID:-ayda}
      $${S3_SECRET_ACCESS_KEY:-ayda-dev-secret}; do sleep 1; done;
      mc mb --ignore-existing local/ayda-media"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ayda}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ayda-dev-secret}

  # Realtime for M2 (direct messages, co-op chats); not used by the API yet.
  centrifugo:
    image: centrifugo/centrifugo:v6
    command: centrifugo
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-change-me}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-change-me}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: '["*"]'
    ports:
      - "8001:8000"

volumes:
  pgdata:
  miniodata:
